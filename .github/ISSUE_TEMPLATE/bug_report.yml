name: Bug report
description: Report a defect or failure in dsh-remedy
title: "[Bug]: "
labels: ["bug"]
body:
  - type: input
    id: remedy_version
    attributes:
      label: dsh-remedy version
      description: The version of dsh-remedy in use.
      placeholder: "0.3.2"
    validations:
      required: true
  - type: input
    id: dsh_version
    attributes:
      label: DSH version
      description: The version of DeepSeek Harness in use.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS
      description: The operating system name and version.
    validations:
      required: true
  - type: input
    id: provider_route
    attributes:
      label: Provider route
      description: The configured provider route and model.
    validations:
      required: true
  - type: textarea
    id: what_happened
    attributes:
      label: What happened
      description: Describe the defect and observed behavior.
    validations:
      required: true
  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected behavior
      description: Describe what should have happened.
    validations:
      required: true
  - type: textarea
    id: status_output
    attributes:
      label: dsh-remedy status --json output
      description: Terminal output from dsh-remedy status --json.
      render: json
    validations:
      required: true
  - type: textarea
    id: journal_excerpt
    attributes:
      label: Redacted journal excerpt
      description: Relevant journal entries with sensitive values removed.
      render: text
    validations:
      required: true
  - type: textarea
    id: session_excerpt
    attributes:
      label: Redacted session excerpt
      description: Relevant session log excerpt with sensitive values removed.
      render: text
    validations:
      required: true
  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmations
      options:
        - label: I confirm that no API key or unredacted session was pasted.
          required: true
