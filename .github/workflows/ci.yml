name: verify

# The standalone public repository pipeline. The container repository has its
# own workflow that runs each project with `working-directory`; this file is the
# one that travels with `dsh-remedy` when it is split into its own repo.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: verify (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run verify
      - name: negative controls
        run: node scripts/gate.mjs --mutate
      # Informational promotion readouts. They are deliberately never a gate:
      # a directory's crawler is not our CI's responsibility to be available.
      - name: catalogue status (informational)
        continue-on-error: true
        run: node scripts/catalog-status.mjs
      - name: traffic readout (informational)
        continue-on-error: true
        run: node scripts/traffic-report.mjs

  windows:
    name: verify (windows, node 24)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run verify

  macos:
    name: verify (macos, node 24)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run verify
      - name: negative controls
        run: node scripts/gate.mjs --mutate
