name: Bug report
description: Report an issue or defect in dsh-remedy.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: input
    id: remedy_version
    attributes:
      label: dsh-remedy version
      description: The installed dsh-remedy version, or the version reported by dsh-remedy status --json.
    validations:
      required: true
  - type: input
    id: dsh_version
    attributes:
      label: DSH version
      description: DeepSeek Harness version.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS
      description: Operating system and environment.
    validations:
      required: true
  - type: input
    id: provider_route
    attributes:
      label: Provider route
      description: Provider route and model.
    validations:
      required: true
  - type: textarea
    id: what_happened
    attributes:
      label: What happened
      description: Describe what happened.
    validations:
      required: true
  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected behavior
      description: Describe what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: status_output
    attributes:
      label: dsh-remedy status --json output
      description: Paste the output of dsh-remedy status --json here.
      render: json
  - type: textarea
    id: journal_excerpt
    attributes:
      label: Redacted journal excerpt
      description: Relevant lines from the journal file if journalPath was configured. Redact any private paths or credentials.
  - type: textarea
    id: session_excerpt
    attributes:
      label: Redacted session excerpt
      description: Relevant lines from the session log. Redact any private paths or credentials.
  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmations
      options:
        - label: I confirm that no API key or unredacted session was pasted.
          required: true
